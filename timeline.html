<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>时间线 · 黑雨 / CHRONICLE</title>
<style>
:root{
  --bg:#0f0505;
  --ink:#f6abab;
  --ink-dim:#ffe2f2;
  --gold:#69561d;
  --cyan:#c92323;
  --line:rgba(255,0,0,.14);
  --glass:rgba(52,0,0,.566);
  --serif:"Noto Serif SC","Songti SC","Source Han Serif SC",Georgia,serif;
  --sans:"Inter","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono","SFMono-Regular",Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100svh;
}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}

/* 颗粒 + 暗角 */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:100;opacity:.035;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:99;
  background:radial-gradient(ellipse at 50% 40%,transparent 40%,rgba(0,0,0,.68) 100%);
}

/* =========================================================
   黑雨 · 悬浮歌单播放器
   ========================================================= */
.music-widget {
  position: fixed;
  top: 84px;
  right: clamp(16px, 4vw, 24px);
  z-index: 95;
  width: 240px;
  background: rgba(15, 5, 5, 0.85);
  backdrop-filter: blur(12px) saturate(140%);
  border: 1px solid var(--line);
  border-radius: 4px;
  overflow: hidden;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.music-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  height: 44px;
  box-sizing: border-box;
}

.music-toggle,
.music-next,
.music-rain {
  background: none;
  border: none;
  color: var(--ink-dim);
  cursor: pointer;
  padding: 0;
  display: grid;
  place-items: center;
  transition: color 0.3s, opacity 0.3s;
}
.music-toggle:hover,
.music-next:hover,
.music-rain:hover { color: var(--ink); }

.music-toggle .icon-pause { display: none; }
.music-toggle.playing .icon-play { display: none; }
.music-toggle.playing .icon-pause { display: block; }

.music-rain {
  opacity: 0.4;
}
.music-rain.is-active {
  color: var(--cyan);
  opacity: 1;
  filter: drop-shadow(0 0 5px rgba(201,35,35,0.6));
}

.music-info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.music-title {
  font-family: var(--serif);
  font-size: 12px;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 2px;
}
.music-artist {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.1em;
  color: var(--gold);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.music-list {
  list-style: none;
  max-height: 0;
  opacity: 0;
  overflow-y: auto;
  transition: max-height 0.4s ease, opacity 0.3s ease;
  border-top: 1px solid var(--line);
  background: rgba(10, 3, 3, 0.6);
}

.music-widget:hover .music-list,
.music-widget.is-open .music-list {
  max-height: 260px;
  opacity: 1;
}

.music-list li {
  padding: 10px 14px;
  font-family: var(--sans);
  font-size: 11px;
  color: var(--ink-dim);
  cursor: pointer;
  border-bottom: 1px solid rgba(255, 0, 0, 0.05);
  transition: all 0.25s;
  display: flex;
  justify-content: space-between;
}
.music-list li:hover {
  background: rgba(201, 35, 35, 0.15);
  color: var(--ink);
  padding-left: 18px;
}
.music-list li.is-active {
  color: var(--cyan);
  background: rgba(201, 35, 35, 0.1);
  font-weight: 500;
}

.music-list::-webkit-scrollbar { width: 4px; }
.music-list::-webkit-scrollbar-track { background: transparent; }
.music-list::-webkit-scrollbar-thumb {
  background: rgba(201, 35, 35, 0.4);
  border-radius: 2px;
}

@media (max-width: 600px) {
  .music-widget { width: 200px; top: 72px; }
  .music-widget:hover .music-list,
  .music-widget.is-open .music-list { max-height: 200px; }
}

/* ===== 顶栏 ===== */
.topbar{
  position:fixed;inset:0 0 auto 0;z-index:90;
  display:flex;align-items:center;justify-content:space-between;
  padding:16px clamp(18px,4vw,52px);
  background:rgba(15,5,5,.72);backdrop-filter:blur(16px) saturate(140%);
  border-bottom:1px solid var(--line);
}
.back{
  display:inline-flex;align-items:center;gap:10px;
  font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--ink-dim);
  transition:color .3s;
}
.back:hover{color:var(--ink)}
.back i{
  display:block;width:16px;height:1px;background:var(--cyan);position:relative;
  transition:width .35s;
}
.back i::before{
  content:"";position:absolute;left:0;top:-3px;width:7px;height:7px;
  border-left:1px solid var(--cyan);border-bottom:1px solid var(--cyan);
  transform:rotate(45deg);
}
.back:hover i{width:24px}
.topbar .serial{
  font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--gold);
}

/* ===== 主体 ===== */
.chronicle{
  position:relative;z-index:5;
  max-width:1080px;margin:0 auto;
  padding:120px clamp(18px,4vw,48px) 140px;
}

/* ---- 页头 ---- */
.head .eyebrow{
  display:flex;align-items:center;gap:12px;margin-bottom:16px;
  font-family:var(--mono);font-size:10px;letter-spacing:.35em;color:var(--gold);
}
.head .eyebrow::before{
  content:"";width:5px;height:5px;border-radius:50%;background:var(--cyan);
  box-shadow:0 0 10px var(--cyan);
}
.head h1{
  font-family:var(--serif);font-weight:600;
  font-size:clamp(36px,6vw,72px);line-height:.95;letter-spacing:.06em;
  text-shadow:0 0 70px rgba(201,35,35,.25);
}
.head h1 small{
  display:block;margin-top:12px;
  font-family:var(--mono);font-weight:300;
  font-size:clamp(10px,1vw,12px);letter-spacing:.5em;color:var(--ink-dim);
  text-transform:uppercase;
}
.head .head-note{
  margin-top:26px;font-size:14px;line-height:1.9;color:var(--ink-dim);
  max-width:560px;
  font-family: var(--serif);
  font-style: italic;
}

/* ---- 年份导航条 ---- */
.year-nav{
  display:flex;gap:8px;flex-wrap:wrap;
  margin-top:40px;padding-top:22px;border-top:1px solid var(--line);
}
.year-nav a{
  font-family:var(--mono);font-size:10px;letter-spacing:.15em;
  color:var(--ink-dim);padding:7px 12px;border:1px solid var(--line);
  border-radius:2px;transition:all .3s;
}
.year-nav a:hover,
.year-nav a.is-current{
  border-color:var(--cyan);color:var(--ink);background:rgba(201,35,35,.1);
}

/* =========================================
   时间轴主体
   ========================================= */
.timeline{
  position:relative;
  margin-top:60px;
  --line-pos: clamp(12px, 3vw, 32px);
  --node-gap: clamp(24px, 5vw, 48px);
}

.timeline::before{
  content:"";position:absolute;
  left:var(--line-pos);top:8px;bottom:8px;width:1px;
  background:linear-gradient(180deg,
    transparent 0%,
    rgba(201,35,35,.15) 8%,
    rgba(201,35,35,.35) 50%,
    rgba(201,35,35,.15) 92%,
    transparent 100%);
}

.tl-node{
  position:relative;
  padding-left: calc(var(--line-pos) + var(--node-gap));
  padding-bottom:clamp(48px,7vh,80px);
  opacity:0;transform:translateY(24px);
  transition:opacity .9s cubic-bezier(.16,1,.3,1),transform .9s cubic-bezier(.16,1,.3,1);
}
.tl-node.in{opacity:1;transform:none}
.tl-node:last-child{padding-bottom:0}

.tl-node::before{
  content:"";position:absolute;
  left:var(--line-pos);
  transform:translateX(-50%);
  top:10px;width:11px;height:11px;border-radius:50%;
  background:var(--bg);border:1px solid var(--cyan);
  box-shadow:0 0 12px rgba(201,35,35,.5);
  transition:background .4s, box-shadow .4s;
  z-index:2;
}
.tl-node.in::before{
  background:var(--cyan);
  box-shadow:0 0 18px rgba(201,35,35,.8);
}
.tl-node[data-importance="critical"].in::before{
  background:#ff4d4d;
  box-shadow:0 0 24px #ff4d4d;
}

.node-inner{
  display:grid;
  grid-template-columns: clamp(80px,14vw,140px) minmax(0,1fr);
  gap:clamp(16px,3vw,36px);
  align-items:start;
}

.node-date{
  font-family:var(--mono);
  font-size:clamp(16px,2.5vw,24px);
  font-weight:500;
  letter-spacing:.06em;
  color:var(--ink);
  line-height:1.3;
  padding-top:2px;
}
.node-date small{
  display:block;margin-top:6px;
  font-size:9px;letter-spacing:.2em;color:var(--gold);
  font-weight:300;
}

.node-card{
  padding:clamp(18px,3vw,26px) clamp(18px,3.4vw,30px);
  background:var(--glass);
  border:1px solid var(--line);
  border-radius:2px;
  backdrop-filter:blur(16px) saturate(130%);
  box-shadow:0 12px 40px rgba(0,0,0,.25);
  transition:border-color .4s, box-shadow .4s;
}
.tl-node:hover .node-card{
  border-color:rgba(201,35,35,.35);
  box-shadow:0 18px 50px rgba(0,0,0,.4);
}
.tl-node[data-importance="critical"] .node-card{
  border-color: rgba(201,35,35,.3);
}

/* 图片样式 */
.node-figure{
  position:relative;margin:0 0 18px;overflow:hidden;border-radius:2px;
  border:1px solid var(--line);background:#0a0303;
  aspect-ratio:16/9;
}
.node-figure img{
  width:100%;height:100%;object-fit:cover;
  filter:saturate(.85) contrast(1.05);
  transition:transform .8s cubic-bezier(.16,1,.3,1);
}
.tl-node:hover .node-figure img{transform:scale(1.02)}
.node-figure figcaption{
  position:absolute;left:0;right:0;bottom:0;padding:10px 14px;
  font-family:var(--mono);font-size:9px;letter-spacing:.18em;
  color:rgba(255,226,242,.7);
  background:linear-gradient(180deg,transparent,rgba(4,8,14,.9));
}

.node-card h2{
  font-family:var(--serif);font-size:clamp(18px,2.4vw,22px);
  font-weight:500;letter-spacing:.05em;
  margin-bottom:12px;
  line-height:1.4;
}
.node-summary{
  font-size:13.5px;line-height:1.9;color:var(--ink);
  margin-bottom:12px;
}
.node-content{
  font-size:13px;line-height:1.95;color:var(--ink-dim);
  white-space:pre-wrap;
  padding-top:12px;
  border-top:1px dashed rgba(255,255,255,.1);
}

/* ---- 页脚 ---- */
.foot{
  margin-top:70px;padding-top:22px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
  font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--ink-dim);
}
.foot-quote{
  font-family:var(--serif);
  font-size:clamp(18px, 3vw, 24px);
  color: var(--ink);
  letter-spacing: .1em;
  text-align: center;
  margin-top: 80px;
  padding: 40px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

/* ===== 响应式 ===== */
@media (max-width:640px){
  .chronicle{padding-top:104px}
  .node-inner{grid-template-columns:1fr;gap:10px}
  .node-date{font-size:16px}
  .node-card{padding:16px 18px}
  .node-card h2{font-size:18px}
  .year-nav{gap:6px}
  .year-nav a{font-size:9px;padding:6px 9px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
  .tl-node{opacity:1;transform:none}
}
</style>
</head>

/* =========================================================
   渲染逻辑 & 音效绑定
   ========================================================= */
(function () {
  const timelineEl = document.getElementById('timeline');
  const navEl = document.getElementById('year-nav');

  // 1. 生成节点 HTML
  timelineEl.innerHTML = TIMELINE_NODES.map(item => {
    const formatText = (text) => text ? String(text).replace(/\n/g, '<br>') : '';

    const figure = item.image
      ? `<figure class="node-figure">
           <img src="${item.image}" alt="${item.title}" loading="lazy"
                onerror="this.parentElement.style.display='none'">
           ${item.imageCaption ? `<figcaption>${item.imageCaption}</figcaption>` : ''}
         </figure>`
      : '';

    const summaryHtml = item.summary ? `<p class="node-summary">${formatText(item.summary)}</p>` : '';
    const contentHtml = item.content ? `<div class="node-content">${formatText(item.content)}</div>` : '';

    return `
      <article class="tl-node" id="${item.id}" data-importance="${item.importance || 'normal'}">
        <div class="node-inner">
          <div class="node-date">${item.date || ''}</div>
          <div class="node-card">
            ${figure}
            <h2>${item.title || '未命名事件'}</h2>
            ${summaryHtml}
            ${contentHtml}
          </div>
        </div>
      </article>
    `;
  }).join('');

  // 2. 生成顶部导航
  navEl.innerHTML = TIMELINE_NODES.map((item, index) => {
    let shortLabel = item.date.split(/[年月日\s]/)[0];
    if (!shortLabel || shortLabel.length > 6) shortLabel = item.date.substring(0, 5);
    if (shortLabel === '大崩塌后') shortLabel = '大崩塌'; 
    return `<a href="#${item.id}">${shortLabel}</a>`;
  }).join('');

  const nodes = document.querySelectorAll('.tl-node');
  const navLinks = document.querySelectorAll('.year-nav a');

  // 3. 滚动观察器 + 音效
  const io = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      entry.target.classList.add('in');
      
      // ★ 节点进入视口音效
      if (typeof window.playTick === 'function') window.playTick();

      const id = entry.target.id;
      navLinks.forEach(a => {
        a.classList.toggle('is-current', a.getAttribute('href') === '#' + id);
      });
    }
  }, {
    rootMargin: '0px 0px -18% 0px',
    threshold: 0.05
  });

  nodes.forEach(node => io.observe(node));

  // 首屏元素直接显示
  nodes.forEach(node => {
    if (node.getBoundingClientRect().top < window.innerHeight * 0.9) {
      node.classList.add('in');
    }
  });

  // 4. 导航点击音效
  navEl.addEventListener('click', (e) => {
    if (e.target.closest('a') && typeof window.playClick === 'function') {
      window.playClick();
    }
  });
})();
</script>
