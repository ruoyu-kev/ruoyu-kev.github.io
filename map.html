<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>黑雨 · 世界地图</title>

<!-- Leaflet 核心样式 -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
:root{
  --bg:#0f0505;
  --ink:#f6abab5d;
  --ink-dim:#ffe2f2;
  --gold:#69561d;
  --cyan:#c92323;
  --line:rgba(255,0,0,0.14);
  --glass:rgba(52,0,0,0.566);
  --serif:"Noto Serif SC","Songti SC","Source Han Serif SC",Georgia,serif;
  --sans:"Inter","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono","SFMono-Regular",Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;overflow:hidden;
}

/* 整页颗粒噪点 */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:600;opacity:.035;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
}

/* ===== 雨粒子画布 ===== */
#rain-canvas{
  position:fixed;inset:0;width:100%;height:100%;
  pointer-events:none;z-index:45;opacity:.6;
}

/* ===== 地图图片处理：适配暗色背景 ===== */
.world-map-image {
  /* 白底黑线转透明底红线 */
  filter: invert(1) sepia(1) saturate(6) hue-rotate(-50deg) contrast(1.2);
  mix-blend-mode: screen; /* 滤掉黑色背景，保留亮部 */
  opacity: 0.6; 
}

/* =========================================================
   黑雨 · 悬浮歌单播放器
   ========================================================= */
.music-widget {
  position: fixed; top: 84px; right: clamp(16px, 4vw, 24px); z-index: 95;
  width: 240px; background: rgba(15, 5, 5, 0.85); backdrop-filter: blur(12px) saturate(140%);
  border: 1px solid var(--line); border-radius: 4px; overflow: hidden;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.music-bar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; height: 44px; box-sizing: border-box; }
.music-toggle, .music-next, .music-rain { background: none; border: none; color: var(--ink-dim); cursor: pointer; padding: 0; display: grid; place-items: center; transition: color 0.3s, opacity 0.3s; }
.music-toggle:hover, .music-next:hover, .music-rain:hover { color: var(--ink); }
.music-toggle .icon-pause { display: none; }
.music-toggle.playing .icon-play { display: none; }
.music-toggle.playing .icon-pause { display: block; }
.music-rain { opacity: 0.4; }
.music-rain.is-active { color: var(--cyan); opacity: 1; filter: drop-shadow(0 0 5px rgba(201,35,35,0.6)); }
.music-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.music-title { font-family: var(--serif); font-size: 12px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
.music-artist { font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em; color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.music-list { list-style: none; max-height: 0; opacity: 0; overflow-y: auto; transition: max-height 0.4s ease, opacity 0.3s ease; border-top: 1px solid var(--line); background: rgba(10, 3, 3, 0.6); }
.music-widget:hover .music-list, .music-widget.is-open .music-list { max-height: 260px; opacity: 1; }
.music-list li { padding: 10px 14px; font-family: var(--sans); font-size: 11px; color: var(--ink-dim); cursor: pointer; border-bottom: 1px solid rgba(255, 0, 0, 0.05); transition: all 0.25s; display: flex; justify-content: space-between; }
.music-list li:hover { background: rgba(201, 35, 35, 0.15); color: var(--ink); padding-left: 18px; }
.music-list li.is-active { color: var(--cyan); background: rgba(201, 35, 35, 0.1); font-weight: 500; }
.music-list::-webkit-scrollbar { width: 4px; }
.music-list::-webkit-scrollbar-track { background: transparent; }
.music-list::-webkit-scrollbar-thumb { background: rgba(201, 35, 35, 0.4); border-radius: 2px; }

/* ===== 左上角返回按钮 ===== */
.back-btn {
  position: fixed; top: clamp(16px, 3vh, 24px); left: clamp(16px, 3vw, 32px); z-index: 500;
  display: inline-flex; align-items: center; gap: 10px; font-family: var(--mono);
  font-size: 11px; letter-spacing: .22em; color: var(--ink-dim); text-decoration: none;
  background: rgba(15,5,5,.7); backdrop-filter: blur(10px); padding: 10px 16px;
  border: 1px solid var(--line); border-radius: 2px; transition: color .3s, border-color .3s, background .3s;
}
.back-btn:hover { color: var(--ink); border-color: rgba(201,35,35,.45); background: rgba(52,0,0,.8); }
.back-btn i { display: block; width: 16px; height: 1px; background: var(--cyan); position: relative; transition: width .35s; }
.back-btn i::before { content: ""; position: absolute; left: 0; top: -3px; width: 7px; height: 7px; border-left: 1px solid var(--cyan); border-bottom: 1px solid var(--cyan); transform: rotate(45deg); }
.back-btn:hover i { width: 24px; }

/* 地图容器 */
#map{ position:fixed;inset:0; width:100%;height:100%; background:#0a0303; z-index:1; }

/* Leaflet 控件暗红化 */
.leaflet-control-attribution{ background:rgba(15,5,5,.7)!important; color:rgba(255,226,242,.4)!important; font-family:var(--mono); font-size:10px!important; letter-spacing:.08em; backdrop-filter:blur(6px); }
.leaflet-control-attribution a{color:var(--cyan)!important}
.leaflet-control-zoom a{ background:rgba(15,5,5,.75)!important; color:var(--ink-dim)!important; border-color:var(--line)!important; backdrop-filter:blur(8px); transition:background .3s,color .3s; }
.leaflet-control-zoom a:hover{ background:rgba(52,0,0,.9)!important; color:var(--ink)!important; }
.leaflet-top.leaflet-right{ margin-top:88px; margin-right:20px; }

/* 左上角标题卡片 */
.map-header{
  position:fixed; top:88px; left:clamp(16px,3vw,32px); z-index:500;
  width:min(360px, calc(100vw - 32px)); padding:22px 24px 20px;
  background:var(--glass); border:1px solid var(--line); border-radius:2px;
  backdrop-filter:blur(20px) saturate(140%);
  box-shadow:0 24px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05);
}
.map-header .kicker{ font-family:var(--mono); font-size:10px; letter-spacing:.4em; color:var(--gold); text-transform:uppercase; margin-bottom:12px; }
.map-header h1{ font-family:var(--serif); font-size:clamp(24px,3vw,32px); font-weight:500; letter-spacing:.08em; color:var(--ink); margin-bottom:8px; }
.map-header .sub{ font-size:13px; line-height:1.85; color:var(--ink-dim); letter-spacing:.02em; }

/* 左下角图例 */
.map-legend{
  position:fixed; left:clamp(16px,3vw,32px); bottom:clamp(16px,3vh,32px); z-index:500;
  font-family:var(--mono); font-size:10px; letter-spacing:.18em; color:var(--ink-dim);
  display:flex; flex-direction:column; gap:10px; pointer-events:none;
}
.map-legend span{display:flex;align-items:center;gap:9px}
.map-legend i{ display:block;width:13px;height:13px; border:1px solid rgba(201,35,35,.6); background:rgba(201,35,35,.15); }
.map-legend i.sub{ border-color: rgba(216,178,106,.8); background: rgba(216,178,106,.15); border-radius: 50%; width: 10px;height: 10px; }
.map-legend i.ring{ border-radius: 50%; border: 3px double rgba(201,35,35,.6); background: transparent; width: 13px; height: 13px; }

/* 右下角区域档案面板 */
#region-panel{
  position:fixed; right:clamp(16px,3vw,32px); bottom:clamp(16px,3vh,32px); z-index:500;
  width:min(360px, calc(100vw - 32px)); background:var(--glass);
  border:1px solid var(--line); border-radius:2px; backdrop-filter:blur(20px) saturate(140%);
  box-shadow:0 24px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);
  padding:24px 24px 22px; transform:translateY(16px); opacity:0; pointer-events:none;
  transition:opacity .4s cubic-bezier(.16,1,.3,1), transform .4s cubic-bezier(.16,1,.3,1);
}
#region-panel.is-open{ opacity:1; transform:translateY(0); pointer-events:auto; }
#region-panel .panel-kicker{ font-family:var(--mono); font-size:10px; letter-spacing:.4em; color:var(--gold); text-transform:uppercase; margin-bottom:12px; }
#region-panel h3{ font-family:var(--serif); font-size:24px; font-weight:500; letter-spacing:.06em; color:var(--ink); margin-bottom:6px; }
#region-panel .panel-en{ font-family:var(--mono); font-size:10px; letter-spacing:.25em; color:var(--ink-dim); text-transform:uppercase; margin-bottom:16px; }
#region-panel p{ font-size:14px; line-height:1.95; color:var(--ink-dim); letter-spacing:.02em; }
#region-panel .panel-close{ position:absolute; top:10px;right:12px; background:none;border:none; color:var(--ink-dim); font-size:20px; line-height:1; padding:6px; cursor:pointer; transition:color .3s; }
#region-panel .panel-close:hover{color:var(--ink)}

/* 底部状态条 */
.map-status{
  position:fixed; left:50%;bottom:20px; transform:translateX(-50%); z-index:500;
  font-family:var(--mono); font-size:10px; letter-spacing:.22em; color:rgba(255,226,242,.35);
  white-space:nowrap; pointer-events:none;
}

/* 区域图形 */
.region-marker{
  fill:rgba(201,35,35,.14); stroke:rgba(201,35,35,.55); stroke-width:1.6; cursor:pointer;
  transition:fill .35s ease, stroke .35s ease, filter .35s ease;
}
.region-marker:hover, .region-marker.is-active{
  fill:rgba(201,35,35,.38); stroke:var(--cyan); stroke-width:2.2;
  filter:drop-shadow(0 0 14px rgba(201,35,35,.55));
}
.sub-region-marker{
  fill:rgba(216,178,106,.08); stroke:rgba(216,178,106,.65); stroke-width:1.2; stroke-dasharray: 4 4;
  cursor:pointer; transition:fill .35s ease, stroke .35s ease, filter .35s ease;
}
.sub-region-marker:hover, .sub-region-marker.is-active{
  fill:rgba(216,178,106,.35); stroke:#ffda75; stroke-width:2; filter:drop-shadow(0 0 12px rgba(216,178,106,.6));
}
.ring-marker{
  fill:rgba(201,35,35,.02); stroke:rgba(201,35,35,.35); stroke-width:1.5; stroke-dasharray: 8 6;
  cursor:pointer; transition:fill .35s ease, stroke .35s ease, filter .35s ease;
}
.ring-marker:hover, .ring-marker.is-active{
  fill:rgba(201,35,35,.15); stroke:var(--cyan); stroke-width:2.2; filter:drop-shadow(0 0 14px rgba(201,35,35,.55));
}

/* 移动端 */
@media (max-width:600px){
  .back-btn { top: 16px; left: 12px; padding: 8px 12px; font-size: 10px; }
  .map-header{ top:76px; left:12px;right:12px; width:auto; padding:18px 18px 16px; }
  .map-header h1{font-size:22px}
  .map-header .sub{font-size:12px}
  #region-panel{ left:12px;right:12px;bottom:12px; width:auto; padding:20px; }
  #region-panel h3{font-size:20px}
  .map-legend{display:none}
  .map-status{display:none}
  .leaflet-top.leaflet-right{ margin-top:auto; margin-bottom:0; }
  .music-widget { width: 200px; top: 72px; }
  .music-widget:hover .music-list, .music-widget.is-open .music-list { max-height: 200px; }
}
@media (prefers-reduced-motion:reduce){
  #rain-canvas{display:none}
}
</style>
</head>
<body>

<canvas id="rain-canvas" aria-hidden="true"></canvas>
<a href="index.html" class="back-btn"><i></i>返回黑雨</a>

<div class="music-widget" id="music-widget">
  <div class="music-bar">
    <button class="music-toggle" id="music-toggle" aria-label="播放或暂停">
      <svg class="icon-play" viewBox="0 0 24 24" width="18" height="18"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
      <svg class="icon-pause" viewBox="0 0 24 24" width="18" height="18"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" fill="currentColor"/></svg>
    </button>
    <div class="music-info">
      <span class="music-title" id="music-title">黑雨 · OST</span>
      <span class="music-artist" id="music-artist">LOADING...</span>
    </div>
    <button class="music-rain" id="music-rain" aria-label="开关雨声" title="开关环境雨声">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 2.5c-3.3 0-6 2.7-6 6 0 2.1 1.1 4 2.8 5l-1.3 2.8c-.2.4 0 .9.4 1.1.4.2.9 0 1.1-.4l1.5-3.2c.5.1 1 .2 1.5.2s1-.1 1.5-.2l1.5 3.2c.2.4.7.6 1.1.4.4-.2.6-.7.4-1.1l-1.3-2.8c1.7-1 2.8-2.9 2.8-5 0-3.3-2.7-6-6-6zm0 9c-1.7 0-3-1.3-3-3s1.3-3 3-3 3 1.3 3 3-1.3 3-3 3z" fill="currentColor"/></svg>
    </button>
    <button class="music-next" id="music-next" aria-label="下一首">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" fill="currentColor"/></svg>
    </button>
  </div>
  <ul class="music-list" id="music-list"></ul>
</div>

<div id="map"></div>

<div class="map-header">
  <div class="kicker">05 / WORLD ATLAS</div>
  <h1>黑雨 · 世界</h1>
  <p class="sub">点击地图上的<strong>大红圈</strong>查看区域简介，点击圈内的<strong>金圈</strong>查看特定设施或子设定档案。</p>
</div>

<div class="map-legend" aria-hidden="true">
  <span><i></i> 主区域</span>
  <span><i class="ring"></i> 环带区域</span>
  <span><i class="sub"></i> 子设定（金圈）</span>
</div>

<div id="region-panel" role="dialog" aria-live="polite">
  <button class="panel-close" aria-label="关闭">×</button>
  <div class="panel-kicker" id="panel-kicker">REGION / 区域档案</div>
  <h3 id="panel-title">—</h3>
  <div class="panel-en" id="panel-en">—</div>
  <p id="panel-desc">点击地图上的发光区域，读取它的档案。</p>
</div>

<div class="map-status" id="map-status">ZOOM 0 · —</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* ============================================================
   1. 地图配置
   ============================================================ */
const MAP_CONFIG = {
  image : 'assets/map-bg.png', 
  width : 1600,
  height: 2844
};

/* ============================================================
   2. 区域数据 
   ============================================================ */
const REGIONS = [
  /* --- 最底层：外环 --- */
  {
    id: 'outer-ring',
    name: '外环',
    en: 'OUTER RING',
    type: 'ring',
    center: [824, 1636], 
    innerRadius: 399,
    outerRadius: 727,
    desc: '环绕断裂带的广阔区域，是都市中最为混乱但也最具活力的地带。'
  },

  /* --- 外环内的五大势力 --- */
  {
    id: 'north-fed',
    name: '北联邦',
    en: 'NORTHERN FEDERATION',
    type: 'circle',
    center: [253, 1799], 
    radius: 80,
    desc: '原型：中欧、北美。整体稳定度：中等。由高新技术和制药巨头联合扶持的傀儡政府，推崇技术官僚主义与自由市场，贫富差距严重。'
  },
  {
    id: 'north-ind',
    name: '北境重工',
    en: 'NORTHERN HEAVY IND.',
    type: 'circle',
    center: [812, 2199], 
    radius: 80,
    desc: '原型：东欧、西伯利亚。整体稳定度：低。能源开发与重工业寡头聚合体，垄断严重，底层物价居高不下，民众怨声载道。'
  },
  {
    id: 'jiulong',
    name: '九龙城邦',
    en: 'JIULONG',
    type: 'circle',
    center: [1375, 1810], 
    radius: 80,
    desc: '原型：东亚、东南亚。整体稳定度：高。大崩塌后唯一没有进行“资源重组”的地区，继承原行政制度，贫富差距最小、治安最好，独立自主性较高。',
    subRegions: [
      { id: 'umbrella-kl', name: '伞节点', en: 'UMBRELLA NODE', type: 'circle', center: [1375, 1810], radius: 20, desc: '维持局部现实的稳定锚，各市区中央均有矗立。其他地方的伞节点不标出' }
    ]
  },
  {
    id: 'sea-port',
    name: '海防堤区',
    en: 'SEA DEFENSE PORT',
    type: 'circle',
    center: [867, 1113], 
    radius: 80,
    desc: '原型：伊比利亚半岛。整体稳定度：高。由原联合政府海军残部与海工企业联合划定的港区，政治地位中立，是都市第二大能源产地。'
  },
  {
    id: 'south-fed',
    name: '南联邦',
    en: 'SOUTHERN FEDERATION',
    type: 'circle',
    center: [315, 1389], 
    radius: 90,
    desc: '原型：南欧、拉丁美洲。整体稳定度：中~低。由军阀与家族主导的傀儡政府，黑手党文化盛行，黑市、偷渡与走私司空见惯。这里的人不知为何都很擅长跑酷。'
  },

  /* --- 断裂带 --- */
  {
    id: 'fault',
    name: '断裂带',
    en: 'THE FAULT',
    type: 'ring',
    center: [824, 1636],
    innerRadius: 225,
    outerRadius: 399,
    desc: '在“大崩塌”后，都市三分之一的环状面积沉降，这一片沉默的都市被称为“断裂带”。空间极不稳定，按深度被比喻为“海”，布满自动防御系统与废弃工业设施。',
    subRegions: [
      {
        id: 'cut-center',
        name: '地质研究中心',
        en: 'RESEARCH CENTER',
        type: 'circle',
        center: [1198, 1806], 
        radius: 25,
        desc: '由外环各势力联合设立的针对断裂带现象进行研究的国际机构，总部设立在海平面处的峭壁上，拥有唯一能直达“海沟层”的电梯。'
      }
    ]
  },

  /* --- 内环 --- */
  {
    id: 'inner',
    name: '内环',
    en: 'INNER RING',
    type: 'circle',
    center: [824, 1636],
    radius: 225,
    desc: '被夺走了政治权利，仅保留了生产与居住功能的区域。底层民众被强制执行计划经济，一切由AI行政节点安排，自由成为可交易的资源。'
  },

  /* --- 核心区 --- */
  {
    id: 'core',
    name: '核心区',
    en: 'CORE AREA',
    type: 'circle',
    center: [824, 1636],
    radius: 78,
    desc: '都市的心脏，巴别塔矗立于此。内环所有市政府与大企业总部集中地，戒备森严，受中央AI直接监管。',
    subRegions: [
      {
        id: 'core-babel',
        name: '巴别塔',
        en: 'BABEL TOWER',
        type: 'circle',
        center: [824, 1636],
        radius: 20,
        desc: '原为太空电梯，如今是集工业生产、行政决策、军事力量投射为一体的综合性巨构，也是黑雨核心政府的最终防线。'

  {
    id: 'unknown',
    name: '未知郊区',
    en: 'THE UNKNOWN',
    type: 'circle',
    center: [250, 900], 
    radius: 130,
    desc: '在外环之外来自不同时空的空间碎片嵌入现实后形成的异常区域，各外环势力控制较弱。',
    subRegions: [
      {
        id: 'unknown-snake',
        name: '衔尾蛇',
        en: 'OUROBOROS',
        type: 'circle',
        center: [200, 850],
        radius: 30,
        desc: '起源不明的武装团体，狂热地寻求将人类转化为“实体”的方式。经常在外环组织突袭“伞”节点。'
      },
      {
        id: 'unknown-ahp',
        name: 'A.H.P 阿加雷斯之手',
        en: 'AGARES\'S HAND',
        type: 'circle',
        center: [300, 950],
        radius: 30,
        desc: '由叛逃战争 AI 组建的军事化巨型企业，不隶属任何政权。主营业务包括资产渗透、刺杀与收容“实体”并进行黑市拍卖。'
      }
    ]
  }
];

/* ============================================================
   3. 初始化地图
   ============================================================ */
const map = L.map('map', {
  crs: L.CRS.Simple,
  minZoom: -2,
  maxZoom: 4,
  zoomControl: false,
  attributionControl: true
});

L.control.zoom({ position: 'topright' }).addTo(map);

const bounds = [[0, 0], [MAP_CONFIG.height, MAP_CONFIG.width]];

L.imageOverlay(MAP_CONFIG.image, bounds, {
  interactive: false,
  className: 'world-map-image'
}).addTo(map);

map.fitBounds(bounds);
map.setMaxBounds([
  [-MAP_CONFIG.height * 0.3, -MAP_CONFIG.width * 0.3],
  [MAP_CONFIG.height * 1.3, MAP_CONFIG.width * 1.3]
]);

/* ============================================================
   4. 绘制区域
   ============================================================ */
const layerById = {};

function createRingLatLngs(center, innerRadius, outerRadius, points = 64) {
  const cx = center[0];
  const cy = center[1];
  const outerLatLngs = [];
  const innerLatLngs = [];
  for (let i = 0; i < points; i++) {
    const angle = (i / points) * 2 * Math.PI;
    outerLatLngs.push([cy + outerRadius * Math.sin(angle), cx + outerRadius * Math.cos(angle)]);
    innerLatLngs.push([cy + innerRadius * Math.sin(angle), cx + innerRadius * Math.cos(angle)]);
  }
  return [outerLatLngs, innerLatLngs];
}

function drawRegion(region, isSub = false) {
  if (!region || !region.id || !region.center) return;

  let layer;
  let className = isSub ? 'sub-region-marker' : 'region-marker';

  if (region.type === 'ring') {
    className = 'ring-marker';
    const latlngs = createRingLatLngs(region.center, region.innerRadius, region.outerRadius);
    layer = L.polygon(latlngs, {
      className: className,
      color: 'rgba(201,35,35,.55)',
      weight: 1.6,
      fillColor: 'rgba(201,35,35,.05)',
      fillOpacity: 1,
      fillRule: 'evenodd'
    }).addTo(map);
  } else if (region.type === 'polygon') {
    const latlngs = region.points.map(p => [p[1], p[0]]);
    layer = L.polygon(latlngs, {
      className: isSub ? 'sub-region-path' : 'region-path',
      color: isSub ? 'rgba(216,178,106,.65)' : 'rgba(201,35,35,.55)',
      weight: isSub ? 1.2 : 1.5,
      fillColor: isSub ? 'rgba(216,178,106,.08)' : 'rgba(201,35,35,.08)',
      fillOpacity: 1
    }).addTo(map);
  } else {
    const center = [region.center[1], region.center[0]];
    layer = L.circle(center, {
      radius: region.radius,
      className: className,
      color: isSub ? 'rgba(216,178,106,.65)' : 'rgba(201,35,35,.55)',
      weight: isSub ? 1.2 : 1.6,
      fillColor: isSub ? 'rgba(216,178,106,.08)' : 'rgba(201,35,35,.14)',
      fillOpacity: 1
    }).addTo(map);
  }

  layerById[region.id] = layer;

  layer.on('click', (e) => {
    L.DomEvent.stopPropagation(e);
    openPanel(region, isSub);
  });
}

REGIONS.forEach(region => {
  drawRegion(region, false);
  if (region.subRegions && Array.isArray(region.subRegions)) {
    region.subRegions.forEach(sub => drawRegion(sub, true));
  }
});

/* ============================================================
   5. 面板交互
   ============================================================ */
const panel      = document.getElementById('region-panel');
const panelKicker= document.getElementById('panel-kicker');
const panelTitle = document.getElementById('panel-title');
const panelEn    = document.getElementById('panel-en');
const panelDesc  = document.getElementById('panel-desc');
const panelClose = panel.querySelector('.panel-close');
const statusEl   = document.getElementById('map-status');

let activeId = null;

function openPanel(region, isSub) {
  if (activeId && layerById[activeId]) {
    layerById[activeId].getElement()?.classList.remove('is-active');
  }
  activeId = region.id;
  layerById[region.id].getElement()?.classList.add('is-active');

  panelKicker.textContent = isSub ? 'SUB-REGION / 子设定档案' : 'REGION / 区域档案';
  
  panelTitle.textContent = region.name;
  panelEn.textContent    = region.en;
  panelDesc.textContent  = region.desc;
  panel.classList.add('is-open');
}

function closePanel(){
  panel.classList.remove('is-open');
  if (activeId && layerById[activeId]) {
    layerById[activeId].getElement()?.classList.remove('is-active');
  }
  activeId = null;
}

panelClose.addEventListener('click', closePanel);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

/* ============================================================
   6. 底部状态条
   ============================================================ */
map.on('zoomend', () => { statusEl.textContent = `ZOOM ${map.getZoom()} · ${MAP_CONFIG.width}×${MAP_CONFIG.height}`; });
map.on('mousemove', e => {
  const x = Math.round(e.latlng.lng);
  const y = Math.round(e.latlng.lat);
  statusEl.textContent = `ZOOM ${map.getZoom()} · X ${x} / Y ${y}`;
});
map.on('mouseout', () => { statusEl.textContent = `ZOOM ${map.getZoom()} · ${MAP_CONFIG.width}×${MAP_CONFIG.height}`; });
statusEl.textContent = `ZOOM ${map.getZoom()} · ${MAP_CONFIG.width}×${MAP_CONFIG.height}`;

/* ============================================================
   7. 雨粒子 Canvas 渲染
   ============================================================ */
(function () {
  const cvs = document.getElementById('rain-canvas');
  if (!cvs) return;
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (prefersReduced) return;

  const ctx = cvs.getContext('2d');
  let W, H, DPR, drops = [];
  const COUNT = window.innerWidth < 768 ? 50 : 120;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = cvs.width = innerWidth * DPR;
    H = cvs.height = innerHeight * DPR;
    cvs.style.width = innerWidth + 'px';
    cvs.style.height = innerHeight + 'px';
  }

  function makeDrop() {
    return {
      x: Math.random() * W, y: Math.random() * H,
      len: (15 + Math.random() * 25) * DPR, speed: (4 + Math.random() * 5) * DPR,
      drift: 0.5 * DPR, alpha: 0.1 + Math.random() * 0.2
    };
  }

  function init() { resize(); drops = Array.from({ length: COUNT }, makeDrop); }

  let last = 0, paused = false;
  document.addEventListener('visibilitychange', () => paused = document.hidden);

  function frame(t) {
    requestAnimationFrame(frame);
    if (paused) return;
    if (t - last < 33) return;
    last = t;
    ctx.clearRect(0, 0, W, H);
    ctx.lineCap = 'round';
    for (const d of drops) {
      ctx.beginPath();
      ctx.strokeStyle = `rgba(201,35,35,${d.alpha})`;
      ctx.lineWidth = 1 * DPR;
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - d.drift, d.y + d.len);
      ctx.stroke();
      d.x -= d.drift; d.y += d.speed;
      if (d.y > H + d.len) { d.y = -d.len; d.x = Math.random() * W; }
      if (d.x < -10) d.x = W + 10;
    }
  }
  init();
  addEventListener('resize', init);
  requestAnimationFrame(frame);
})();

/* ===== 临时坐标拾取器 ===== */
map.on('click', function(e) {
  const x = Math.round(e.latlng.lng);
  const y = Math.round(e.latlng.lat);
  const text = `[${x}, ${y}]`;
  
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => {
      L.popup()
        .setLatLng(e.latlng)
        .setContent(`
          <div style="text-align:center; font-family:monospace; color:#000;">
            <b>坐标已复制！</b><br>
            center: <span style="color:#c92323; font-size:16px;">${text}</span>
          </div>
        `)
        .openOn(map);
    }).catch(err => console.error("复制失败", err));
  } else {
    L.popup()
      .setLatLng(e.latlng)
      .setContent(`
        <div style="text-align:center; font-family:monospace; color:#000;">
          <b>请手动复制：</b><br>
          center: <span style="color:#c92323; font-size:16px;">${text}</span>
        </div>
      `)
      .openOn(map);
  }
});

</script>
